# Coolify: deploy with the "Docker Compose" build pack.
# Day-to-day settings live in the dashboard; these variables only seed the very first boot.
services:
  minecraft:
    build:
      context: .
    ports:
      - "25565:25565"
    environment:
      MC_VERSION: ${MC_VERSION:-26.2}
      EULA: ${EULA:-true}
      # TLauncher players need offline mode. Do not turn this on unless every player has a paid account.
      ONLINE_MODE: ${ONLINE_MODE:-false}
      ENFORCE_SECURE_PROFILE: ${ENFORCE_SECURE_PROFILE:-false}
      OPS: ${OPS:-IGhost_RiderI}
      INIT_MEMORY: ${INIT_MEMORY:-1G}
      MAX_MEMORY: ${MAX_MEMORY:-2G}
    volumes:
      - minecraft-data:/data
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  minecraft-data:
