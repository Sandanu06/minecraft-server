# Coolify: second application in this repo. Build pack "Docker Compose", base directory /dashboard.
# The dashboard controls the Minecraft container through the Docker socket and reads its data volume.
services:
  dashboard:
    build:
      context: .
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-988}"
    mem_limit: 300m
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH (node index.js --hash <password>)}
      MC_PROJECT: ${MC_PROJECT:-fb06ymf6y88v42zcevgm7m9m}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The next path is fixed because Coolify rejects variables in volume sources.
      - /var/lib/docker/volumes/fb06ymf6y88v42zcevgm7m9m_minecraft-data/_data:/mc-data
      - /srv/minecraft-backups:/backups
      - dashboard-state:/state

volumes:
  dashboard-state:
