name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check entrypoint script
        run: bash -n entrypoint.sh && shellcheck -S warning entrypoint.sh
      - name: Build image (verifies Mojang download + checksum)
        run: docker build -t minecraft-server:ci .
      - name: Smoke test (server reaches "Done")
        run: |
          docker run -d --name mc -e MAX_MEMORY=1G -e INIT_MEMORY=512M minecraft-server:ci
          for i in $(seq 1 60); do
            if docker logs mc 2>&1 | grep -q 'Done ('; then echo "Server started"; docker logs mc | tail -5; exit 0; fi
            sleep 3
          done
          docker logs mc; exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
        run: |
          curl -fsS --retry 3 \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_RESOURCE_UUID}&force=false"
